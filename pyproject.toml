[project]
name = "ppu-telegram-bot"
version = "0.1.0"
description = "PPU Telegram bot with encryption"
authors = [{name = "Anastasiia Matveeva", email = "armatveeeva@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram>=3.31.0,<4.0.0",
    "docxtpl>=0.20.2,<0.21.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pyzipper>=0.4.0,<0.5.0",
    "pydantic-settings>=2.6.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3,<0.18.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pre-commit>=4.7.0,<5.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "ppu_bot", from = "src"}]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["main.py", "src/bot.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docxtpl", "docx.*", "openpyxl", "pyzipper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=ppu_bot"

[tool.coverage.run]
source = ["src/ppu_bot"]
omit = ["tests/*"]